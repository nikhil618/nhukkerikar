<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nikhil Hukkerikar — Engineering Leader, Frontend Platforms</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <!-- SVG where it is supported; the .ico carries 16/32/48 rasters for the
         browsers and shells that ignore it, and Apple ignores both in favour
         of a square PNG it rounds itself. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- Inter is pulled in by the Nocturne stylesheet's own @import, which the
         production build inlines; these only warm the font-file origin. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Resolve the stored color mode before first paint. The app is prerendered
      dark, so without this a light-mode visitor sees a dark flash on load.
      Runs against <html>, which Angular does not hydrate, so it cannot cause a
      hydration mismatch.
    -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('nh-theme') || 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' && !window.matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          /* storage blocked — the dark default in CSS stands */
        }
      })();
    </script>

    <!--
      Resolve the view (leadership or architecture) before first paint, the
      same way. Both views are in the prerendered HTML and CSS shows the one
      named by <html data-lens>, so setting it here means an architecture
      visitor never sees the leadership copy flash first.

      `?view=architecture` or `?view=leadership` opens the site on that view
      and remembers it; otherwise the stored choice wins, then the default.

      The change listener lets the toggle work before Angular hydrates. After
      hydration LensStore owns the attribute and this becomes a no-op echo.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var KEY = 'nh-lens';
        var FROM_PARAM = { leadership: 'lead', architecture: 'arch' };

        function isLens(value) {
          return value === 'lead' || value === 'arch';
        }

        function store(lens) {
          try {
            localStorage.setItem(KEY, lens);
          } catch (e) {
            /* storage blocked — the choice lasts for this page view */
          }
        }

        var lens = null;
        try {
          lens = FROM_PARAM[new URLSearchParams(location.search).get('view')] || null;
          if (lens) {
            store(lens);
          } else {
            lens = localStorage.getItem(KEY);
          }
        } catch (e) {
          /* storage or URL API unavailable — fall through to the default */
        }
        if (isLens(lens)) {
          root.setAttribute('data-lens', lens);
        }

        // Every toggle on the page (header and hero) shows the same choice.
        function syncRadios(current) {
          var inputs = document.querySelectorAll('input[data-lens-input]');
          for (var i = 0; i < inputs.length; i++) {
            inputs[i].checked = inputs[i].value === current;
          }
        }

        document.addEventListener('change', function (event) {
          var input = event.target;
          if (
            input &&
            input.hasAttribute &&
            input.hasAttribute('data-lens-input') &&
            isLens(input.value)
          ) {
            root.setAttribute('data-lens', input.value);
            store(input.value);
            syncRadios(input.value);
          }
        });

        // The radios are prerendered with the default checked; match them to
        // the view that is actually showing.
        document.addEventListener('DOMContentLoaded', function () {
          var current = root.getAttribute('data-lens');
          if (isLens(current)) {
            syncRadios(current);
          }
        });
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
