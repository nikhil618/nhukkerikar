<section aria-labelledby="experience-heading">
  <h2 id="experience-heading" class="kicker">Experience</h2>

  <ol class="track">
    @for (entry of entries(); track entry.role.id; let last = $last) {
      <li class="entry" [class.is-last]="last">
        <app-timeline-marker [tone]="entry.tone" />

        <div class="head">
          <h3>{{ entry.role.title }} — {{ entry.role.org }}</h3>
          <span class="period" [class.is-current]="entry.role.era === 'current'">
            {{ entry.role.period }}
          </span>
        </div>

        @for (summary of entry.summaries; track summary.lens) {
          <p class="summary" [attr.data-lens-only]="summary.lens">{{ summary.value }}</p>
        }
      </li>
    }
  </ol>
</section>
