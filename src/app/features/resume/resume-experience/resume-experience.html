<section aria-labelledby="experience-heading">
  <h2 id="experience-heading" class="resume-heading">Experience</h2>

  @for (entry of entries(); track entry.role.id; let last = $last) {
    <article class="entry" [class.is-last]="last">
      <app-timeline-marker [tone]="entry.tone" />

      <div class="head">
        <h3>{{ entry.role.org }} — {{ entry.role.title }}</h3>
        <span class="period" [class.is-current]="entry.role.era === 'current'">
          {{ entry.role.period }}
        </span>
      </div>

      <ul class="highlights">
        @for (highlight of entry.role.highlights; track $index) {
          <li>{{ highlight }}</li>
        }
      </ul>
    </article>
  }
</section>
